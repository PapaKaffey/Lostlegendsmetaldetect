<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1a1a1a">
  <title>Request Sent | Lost Legends Metal Detection &amp; Recovery</title>
  <link rel="stylesheet" href="style.css">
  <style>
  :root {
    --gold: #c9a227;
    --ink: #111;
  }

  body {
    display: grid;
    min-height: 100vh;
    margin: 0;
    place-items: center;
    padding: 24px;
    background: #f7f5ef;
    color: var(--ink);
    font-family: system-ui, sans-serif;
  }

  .confirmation {
    width: min(100%, 620px);
    padding: clamp(28px, 6vw, 56px);
    border-top: 5px solid var(--gold);
    border-radius: 14px;
    background: #fff;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.12);
    text-align: center;
  }

  .confirmation__eyebrow {
    margin: 0 0 10px;
    color: #806300;
    font-size: 0.85rem;
    font-weight: 800;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .confirmation h1 {
    margin: 0;
  }

  .confirmation p {
    margin: 18px auto 0;
    max-width: 52ch;
    line-height: 1.6;
  }

  .confirmation__actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
    margin-top: 28px;
  }

  .confirmation__button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    padding: 0 16px;
    border: 2px solid var(--ink);
    border-radius: 8px;
    color: var(--ink);
    font-weight: 700;
    text-decoration: none;
  }

  .confirmation__button--gold {
    border-color: var(--gold);
    background: var(--gold);
  }

  :where(a):focus-visible {
    outline: 3px solid #fff;
    outline-offset: 2px;
    box-shadow: 0 0 0 5px #6d5200;
  }
  </style>
</head>
<body>
  <main class="confirmation" id="main" tabindex="-1">
    <p class="confirmation__eyebrow">Lost Legends</p>
    <h1>Thanks—your request was sent.</h1>
    <p>Alex will review your information and respond as soon as possible. For an urgent recovery, calling or texting is the fastest option.</p>
    <div class="confirmation__actions">
      <a class="confirmation__button confirmation__button--gold" href="tel:+14023096379">Call (402) 309-6379</a>
      <a class="confirmation__button" href="sms:+14023096379">Text Alex</a>
      <a class="confirmation__button" href="/">Return to the site</a>
    </div>
  </main>
</body>
</html>
