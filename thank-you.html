<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You | Lost Legends</title>
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f6f1e9;
      padding: 20px;
    }
    .thank-you-card {
      max-width: 520px;
      width: 100%;
      background: white;
      border-radius: 16px;
      padding: 40px 28px;
      text-align: center;
      box-shadow: 0 14px 40px rgba(0,0,0,.10);
    }
    .thank-you-card h1 {
      margin: 0 0 12px;
      font-size: 1.55rem;
      line-height: 1.25;
      color: #111;
    }
    .thank-you-card p {
      margin: 0 0 28px;
      color: #6b625a;
      font-size: 1.05rem;
    }
    .thank-you-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .thank-you-actions .button {
      width: 100%;
      justify-content: center;
    }
    .back-link {
      display: inline-block;
      margin-top: 24px;
      color: #c96a1b;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="thank-you-card">
    <h1>Got it — I’ll text or call you back as soon as possible</h1>
    <p>Thanks for reaching out. I usually reply the same day.</p>

    <div class="thank-you-actions">
      <a href="tel:+14023096379" class="button button--dark">Call (402) 309-6379</a>
      <a href="sms:+14023096379" class="button button--light">Text (402) 309-6379</a>
    </div>

    <a href="/" class="back-link">← Back to homepage</a>
  </div>
</body>
</html>
